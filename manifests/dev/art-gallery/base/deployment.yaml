# =============================================================================
# deployment.yaml — art-gallery app workload (Kustomize base)
# =============================================================================
# Same shape as online-shop/base/deployment.yaml. Only differences:
#   - app name: art-gallery
#   - probe path: /art-gallery/healthz

apiVersion: apps/v1
kind: Deployment
metadata:
  name: art-gallery
  namespace: art-gallery
  labels:
    app: art-gallery
    managed-by: argocd
spec:
  replicas: 2
  selector:
    matchLabels:
      app: art-gallery
  template:
    metadata:
      labels:
        app: art-gallery
    spec:
      containers:
        - name: art-gallery
          image: art-gallery
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /art-gallery/healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /art-gallery/healthz
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            # Distroless 'nonroot' UID/GID = 65532. HARD RULE from GCP.
            runAsUser: 65532
            runAsGroup: 65532
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
